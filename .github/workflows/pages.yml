name: Deploy web page (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["src/**", "tools/shopmine-order-alert/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # 샵마인 PC 알림 프로그램도 같이 올려서, PC 설치 파일이 여기서 받아 가게 함 (…/pc/)
      - name: Add PC alert tool
        run: mkdir -p src/pc && cp tools/shopmine-order-alert/shopmine_alert.py tools/shopmine-order-alert/install.bat tools/shopmine-order-alert/install.ps1 src/pc/
      - name: Upload src as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
